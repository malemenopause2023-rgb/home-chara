<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="うさぎ">
<title>ホームのうさぎ</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4E3B2E; --ink-soft:#8A7464; --ear:#E7A39E; --sheet:rgba(255,252,247,.88);
  --line:rgba(78,59,46,.14); --stage:#C9D3D6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#F3E8DD;--ink-soft:#BFAE9F;--sheet:rgba(46,38,33,.9);--line:rgba(243,232,221,.16);--stage:#2B3236;}
}
:root[data-theme="dark"]{--ink:#F3E8DD;--ink-soft:#BFAE9F;--sheet:rgba(46,38,33,.9);--line:rgba(243,232,221,.16);--stage:#2B3236;}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--stage);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#stage,#calib{touch-action:none}

#stage{position:fixed;inset:0;overflow:hidden;background:var(--stage) center/cover no-repeat}
#empty{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:min(78vw,320px);text-align:center;font-size:15px;line-height:1.8}
#empty button{margin-top:14px}
#shadow{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(closest-side,rgba(40,28,20,.32),rgba(40,28,20,0));pointer-events:none;will-change:transform}
#chara{position:absolute;left:0;top:0;transform-origin:50% 100%;will-change:transform;-webkit-user-drag:none;cursor:pointer}

#gear{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:none;background:var(--sheet);color:var(--ink);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;transition:opacity .6s;z-index:5}
#gear.dim{opacity:.18}
#gear svg{width:22px;height:22px}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--sheet);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);border-radius:26px 26px 0 0;padding:10px 22px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto;max-height:88vh;overflow-y:auto}
#sheet.open{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
#sheet h2{font-size:19px;font-weight:700;margin:0 0 4px}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:none}
.thumb{width:52px;height:52px;border-radius:12px;background:rgba(127,127,127,.15) center/contain no-repeat;flex:none}
.thumb.bg{background-size:cover}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:15px;font-weight:700}
.txt span{display:block;font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.btn{font:inherit;font-size:14px;font-weight:700;border:none;border-radius:999px;padding:9px 16px;background:var(--ink);color:var(--sheet);white-space:nowrap}
.btn.sub{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:focus-visible,#gear:focus-visible,input:focus-visible{outline:3px solid var(--ear);outline-offset:2px}
.inline{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
label.check{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-top:8px}
label.check input{width:18px;height:18px;accent-color:var(--ear)}
input[type=range]{width:100%;accent-color:var(--ear)}
#status{font-size:12.5px;color:var(--ink-soft);min-height:1.4em;margin-top:6px}
input[type=file]{display:none}

/* アイコン位置合わせ */
#calib{position:fixed;inset:0;z-index:8;display:none}
#calib.on{display:block}
#cells{position:absolute;inset:0}
.cell{position:absolute;border-radius:24%;border:2.5px solid rgba(255,255,255,.95);box-shadow:0 0 0 1.5px rgba(0,0,0,.35);background:rgba(231,163,158,.28)}
.cell.off{border-style:dashed;border-color:rgba(255,255,255,.6);background:transparent;box-shadow:none}
.handle{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(231,163,158,.55);border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35);touch-action:none;z-index:2}
.handle::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff}
#hDock{border-radius:12px;width:56px;height:30px;margin:-15px 0 0 -28px}
#calibBar{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:22px 22px 0 0;padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
#calibBar p{margin:0 0 10px;font-size:13px;line-height:1.6;color:var(--ink)}
#calibBar .inline{margin-top:10px}
#calibBar.top{top:0;bottom:auto;border-radius:0 0 22px 22px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:14px}
</style>
</head>
<body>
<div id="stage">
  <div id="empty">ホーム画面のスクリーンショットを選ぶと、<br>その上でうさぎが動きます。<br><button class="btn" id="emptyPick">スクリーンショットを選ぶ</button></div>
  <div id="shadow"></div>
  <img id="chara" alt="キャラクター" draggable="false">
</div>

<button id="gear" aria-label="設定を開く"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>

<div id="calib" aria-label="アイコンの位置合わせ">
  <div id="cells"></div>
  <div class="handle" id="hA" aria-label="左上のアイコン"></div>
  <div class="handle" id="hB" aria-label="右下のアイコン"></div>
  <div class="handle" id="hDock" aria-label="ドック"></div>
  <div id="calibBar">
    <p>丸を<b>左上</b>と<b>右下</b>のアイコンの中心に、横長のつまみを<b>ドック</b>のアイコンに合わせてください。枠をタップすると「アイコンあり／なし」を切り替えられます。</p>
    <label style="font-size:13px">枠の大きさ</label>
    <input type="range" id="iconSize" min="10" max="22" step="0.2" value="15.5" aria-label="枠の大きさ">
    <div class="inline">
      <button class="btn sub" id="detect">アイコンを自動で探す</button>
      <button class="btn sub" id="flipBar">案内を上へ</button>
      <button class="btn" id="calibDone">完了</button>
    </div>
  </div>
</div>

<div id="sheet" role="dialog" aria-label="設定">
  <div class="grab"></div>
  <h2>設定</h2>
  <div class="row">
    <div class="thumb bg" id="bgThumb"></div>
    <div class="txt"><b>ホーム画面</b><span>iPhoneで撮ったホーム画面のスクリーンショット</span></div>
    <button class="btn" id="pickBg">選ぶ</button>
  </div>
  <div class="row">
    <div class="txt"><b>アイコンの位置</b><span id="iconInfo">スクリーンショットを選ぶと合わせられます</span></div>
    <button class="btn" id="openCalib">合わせる</button>
  </div>
  <div class="row" style="align-items:flex-start">
    <div class="thumb" id="chThumb"></div>
    <div class="txt"><b>キャラクター</b><span>好きな画像に切り替えられます</span>
      <label class="check"><input type="checkbox" id="cut" checked>白っぽい背景を自動で消す</label>
      <div class="inline"><button class="btn" id="pickCh">画像を選ぶ</button><button class="btn sub" id="resetCh">うさぎに戻す</button></div>
      <div id="status" aria-live="polite"></div>
    </div>
  </div>
  <div class="row" style="display:block">
    <div class="txt"><b>大きさ</b></div>
    <input type="range" id="size" min="10" max="40" step="1" value="15" aria-label="キャラクターの大きさ">
  </div>
  <div class="row"><button class="btn" id="close" style="width:100%">閉じる</button></div>
</div>
<input type="file" id="fileBg" accept="image/*">
<input type="file" id="fileCh" accept="image/*">

/* ---------- 保存（IndexedDB） ---------- */
const DB={db:null,
  open(){return new Promise(r=>{try{const q=indexedDB.open('home-chara',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{this.db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})},
  get(k){return new Promise(r=>{try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})},
  set(k,v){try{this.db.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}},
  del(k){try{this.db.transaction('kv','readwrite').objectStore('kv').delete(k)}catch(e){}}
};

/* ---------- 状態 ---------- */
const S={x:0,y:0,dir:1,w:100,h:100,sizePct:15,mode:'idle',t:0,dur:2,
  hopFrom:null,hopTo:null,target:null,ratio:1.53,tilt:0,goal:null,hops:0,paused:false};

/* アイコン配置：画面に対する割合で保持（4列×6行＋ドック4つ） */
const COLS=4,ROWS=6;
const G={ax:.155,ay:.115,bx:.845,by:.705,dockY:.915,size:.155};
let OCC=new Array(COLS*ROWS+COLS).fill(false);
let hasBg=false,bgImg=null;

function readFile(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}
function loadImg(src){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src})}

/* ---------- キャラ画像の背景を消す ---------- */
async function cutout(src){
  const img=await loadImg(src);
  const max=520,sc=Math.min(1,max/Math.max(img.width,img.height));
  const w=Math.round(img.width*sc),h=Math.round(img.height*sc);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');g.drawImage(img,0,0,w,h);
  const d=g.getImageData(0,0,w,h),p=d.data;
  let br=0,bg=0,bb=0,n=0;
  for(const [x,y] of [[2,2],[w-3,2],[2,h-3],[w-3,h-3]]){const i=(y*w+x)*4;br+=p[i];bg+=p[i+1];bb+=p[i+2];n++}
  br/=n;bg/=n;bb/=n;
  const fg=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++){const dr=p[i*4]-br,dg=p[i*4+1]-bg,db=p[i*4+2]-bb;fg[i]=dr*dr+dg*dg+db*db>900?1:0}
  const R=6,dil=new Uint8Array(w*h),tmp=new Uint8Array(w*h);
  for(let y=0;y<h;y++){let run=-1e9;for(let x=0;x<w;x++){if(fg[y*w+x])run=x;tmp[y*w+x]=x-run<=R?1:0}run=1e9;for(let x=w-1;x>=0;x--){if(fg[y*w+x])run=x;if(run-x<=R)tmp[y*w+x]=1}}
  for(let x=0;x<w;x++){let run=-1e9;for(let y=0;y<h;y++){if(tmp[y*w+x])run=y;dil[y*w+x]=y-run<=R?1:0}run=1e9;for(let y=h-1;y>=0;y--){if(tmp[y*w+x])run=y;if(run-y<=R)dil[y*w+x]=1}}
  const out=new Uint8Array(w*h),st=[];
  for(let x=0;x<w;x++){st.push(x,(h-1)*w+x)}for(let y=0;y<h;y++){st.push(y*w,y*w+w-1)}
  while(st.length){const i=st.pop();if(out[i]||dil[i])continue;out[i]=1;const x=i%w;
    if(x>0)st.push(i-1);if(x<w-1)st.push(i+1);if(i>=w)st.push(i-w);if(i<w*(h-1))st.push(i+w)}
  let minX=w,minY=h,maxX=0,maxY=0;
  for(let i=0;i<w*h;i++){
    let keep=!out[i];
    if(keep&&!fg[i]){const x=i%w,y=(i/w)|0;let near=false;
      for(let k=1;k<=R&&!near;k++){if(x-k>=0&&out[i-k]||x+k<w&&out[i+k]||y-k>=0&&out[i-k*w]||y+k<h&&out[i+k*w])near=true}
      if(near)keep=false}
    if(!keep)p[i*4+3]=0;else{const x=i%w,y=(i/w)|0;if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}
  }
  g.putImageData(d,0,0);
  if(maxX<=minX||maxY<=minY)return c.toDataURL('image/png');
  const c2=document.createElement('canvas');c2.width=maxX-minX+1;c2.height=maxY-minY+1;
  c2.getContext('2d').drawImage(c,minX,minY,c2.width,c2.height,0,0,c2.width,c2.height);
  return c2.toDataURL('image/png');
}

/* ---------- アイコンの位置 ---------- */
function cellRects(){
  const W=innerWidth,H=innerHeight,s=G.size*W,list=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const cx=(G.ax+(G.bx-G.ax)*c/(COLS-1))*W,cy=(G.ay+(G.by-G.ay)*r/(ROWS-1))*H;
    list.push({x:cx-s/2,y:cy-s/2,s,cx,cy,i:r*COLS+c,dock:false});
  }
  for(let c=0;c<COLS;c++){
    const cx=(G.ax+(G.bx-G.ax)*c/(COLS-1))*W,cy=G.dockY*H;
    list.push({x:cx-s/2,y:cy-s/2,s,cx,cy,i:ROWS*COLS+c,dock:true});
  }
  return list;
}
function icons(){return hasBg?cellRects().filter(r=>OCC[r.i]):[]}
function updateIconInfo(){
  const n=OCC.filter(Boolean).length;
  $('iconInfo').textContent=hasBg?`アイコン ${n} 個を認識中`:'スクリーンショットを選ぶと合わせられます';
}

/* 自動判定：枠の中と、すき間（壁紙）の色を比べる */
function detectIcons(){
  if(!bgImg)return;
  const W=innerWidth,H=innerHeight;
  const sc=Math.max(W/bgImg.width,H/bgImg.height),ox=(W-bgImg.width*sc)/2,oy=(H-bgImg.height*sc)/2;
  const cv=document.createElement('canvas');cv.width=Math.round(W);cv.height=Math.round(H);
  const g=cv.getContext('2d',{willReadFrequently:true});g.drawImage(bgImg,ox,oy,bgImg.width*sc,bgImg.height*sc);
  const stat=(x,y,w,h)=>{x=Math.max(0,Math.round(x));y=Math.max(0,Math.round(y));w=Math.max(1,Math.min(cv.width-x,Math.round(w)));h=Math.max(1,Math.min(cv.height-y,Math.round(h)));
    const p=g.getImageData(x,y,w,h).data;let r=0,gg=0,b=0,l=0,l2=0,n=p.length/4;
    for(let i=0;i<p.length;i+=4){r+=p[i];gg+=p[i+1];b+=p[i+2];const L=.3*p[i]+.59*p[i+1]+.11*p[i+2];l+=L;l2+=L*L}
    r/=n;gg/=n;b/=n;l/=n;return{r,g:gg,b,sd:Math.sqrt(Math.max(0,l2/n-l*l))}};
  const rects=cellRects(),pitch=(G.bx-G.ax)*W/(COLS-1),gapW=Math.max(3,pitch-rects[0].s)*.45;
  for(const R of rects){
    const inner=stat(R.x+R.s*.15,R.y+R.s*.15,R.s*.7,R.s*.7);
    const gl=stat(R.x-gapW-2,R.y+R.s*.2,gapW,R.s*.6),gr=stat(R.x+R.s+2,R.y+R.s*.2,gapW,R.s*.6);
    const ref={r:(gl.r+gr.r)/2,g:(gl.g+gr.g)/2,b:(gl.b+gr.b)/2,sd:(gl.sd+gr.sd)/2};
    const dist=Math.hypot(inner.r-ref.r,inner.g-ref.g,inner.b-ref.b);
    OCC[R.i]=dist>26||inner.sd>ref.sd*1.6+12;
  }
  updateIconInfo();
}

/* ---------- 位置合わせ画面 ---------- */
function renderCalib(){
  const W=innerWidth,H=innerHeight,box=$('cells');box.innerHTML='';
  for(const R of cellRects()){
    const d=document.createElement('div');d.className='cell'+(OCC[R.i]?'':' off');
    d.style.cssText=`left:${R.x}px;top:${R.y}px;width:${R.s}px;height:${R.s}px`;
    d.addEventListener('pointerdown',e=>{e.preventDefault();OCC[R.i]=!OCC[R.i];d.classList.toggle('off',!OCC[R.i]);updateIconInfo()});
    box.appendChild(d);
  }
  const p=(el,x,y)=>{el.style.left=x+'px';el.style.top=y+'px'};
  p($('hA'),G.ax*W,G.ay*H);p($('hB'),G.bx*W,G.by*H);p($('hDock'),G.ax*W,G.dockY*H);
}
function dragHandle(el,apply){
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();el.setPointerCapture(e.pointerId);
    const move=ev=>{apply(ev.clientX/innerWidth,ev.clientY/innerHeight);renderCalib()};
    const up=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);detectIcons();renderCalib();saveGeo()};
    el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  });
}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
dragHandle($('hA'),(x,y)=>{G.ax=clamp(x,.02,G.bx-.1);G.ay=clamp(y,.02,G.by-.1)});
dragHandle($('hB'),(x,y)=>{G.bx=clamp(x,G.ax+.1,.98);G.by=clamp(y,G.ay+.1,G.dockY-.03)});
dragHandle($('hDock'),(x,y)=>{G.dockY=clamp(y,G.by+.03,.99)});
$('iconSize').oninput=e=>{G.size=e.target.value/100;renderCalib()};
$('iconSize').onchange=()=>{detectIcons();renderCalib();saveGeo()};
$('detect').onclick=()=>{detectIcons();renderCalib();saveGeo()};
$('flipBar').onclick=()=>{const b=$('calibBar');b.classList.toggle('top');$('flipBar').textContent=b.classList.contains('top')?'案内を下へ':'案内を上へ'};
function openCalib(){
  if(!hasBg){$('status').textContent='';sheet.classList.add('open');return}
  sheet.classList.remove('open');$('iconSize').value=(G.size*100).toFixed(1);
  calib.classList.add('on');gear.style.display='none';S.paused=true;chara.style.visibility=shadow.style.visibility='hidden';renderCalib();
}
function closeCalib(){
  calib.classList.remove('on');gear.style.display='';S.paused=false;chara.style.visibility=shadow.style.visibility='';
  saveGeo();rescue();startIdle();wake();
}
$('openCalib').onclick=openCalib;$('calibDone').onclick=closeCalib;
function saveGeo(){DB.set('geo',{...G});DB.set('occ',OCC.slice())}

/* ---------- 表示 ---------- */
async function setBg(src){
  stage.style.backgroundImage=src?`url("${src}")`:'';
  $('bgThumb').style.backgroundImage=src?`url("${src}")`:'';
  $('empty').style.display=src?'none':'block';
  hasBg=!!src;bgImg=src?await loadImg(src):null;updateIconInfo();
}
async function setChar(src){
  const img=await loadImg(src);S.ratio=img.height/img.width;
  chara.src=src;$('chThumb').style.backgroundImage=`url("${src}")`;layout();
}
function bounds(){
  const W=innerWidth,H=innerHeight;
  return {minX:4,maxX:W-S.w-4,minY:Math.max(54,H*0.07)-S.h*.3,maxY:H-S.h-Math.max(24,H*0.03)};
}
function layout(){
  S.w=Math.round(innerWidth*S.sizePct/100);S.h=Math.round(S.w*S.ratio);
  chara.style.width=S.w+'px';chara.style.height=S.h+'px';
  shadow.style.width=S.w*0.8+'px';shadow.style.height=S.w*0.16+'px';
  const b=bounds();S.x=clamp(S.x,b.minX,b.maxX);S.y=clamp(S.y,b.minY,b.maxY);
}

/* ---------- 当たり判定：足元がアイコンに乗らないようにする ---------- */
function feetFree(x,y,ignore){
  const fy=y+S.h-3,pad=4;
  for(const R of icons()){
    if(R===ignore||ignore&&R.i===ignore.i)continue;
    if(fy<R.y-pad||fy>R.y+R.s+pad)continue;
    for(const fx of [x+S.w*.3,x+S.w*.5,x+S.w*.7])if(fx>R.x-pad&&fx<R.x+R.s+pad)return false;
  }
  return true;
}
function inBounds(x,y,b=bounds()){return x>=b.minX&&x<=b.maxX&&y>=b.minY&&y<=b.maxY}
function freeSpot(){
  const b=bounds();
  for(let k=0;k<60;k++){const x=rnd(b.minX,b.maxX),y=rnd(b.minY,b.maxY);if(feetFree(x,y))return{x,y}}
  return{x:rnd(b.minX,b.maxX),y:rnd(b.minY,b.maxY)};
}
/* アイコンに埋まってしまったら近くの空いている場所へ */
function rescue(){
  if(feetFree(S.x,S.y))return;
  const b=bounds();
  for(let r=8;r<innerWidth;r+=8)for(let a=0;a<16;a++){
    const x=S.x+Math.cos(a/16*Math.PI*2)*r,y=S.y+Math.sin(a/16*Math.PI*2)*r;
    if(inBounds(x,y,b)&&feetFree(x,y)){S.x=x;S.y=y;return}
  }
}

/* 寄りかかる場所を探す */
function leanSpot(){
  const list=icons();if(!list.length)return null;
  const b=bounds(),relaxed={...b,minX:-S.w*.25,maxX:innerWidth-S.w*.75},good=[],ok=[];
  for(const R of list)for(const side of ['L','R']){
    const x=side==='L'?R.x-S.w*.86:R.x+R.s-S.w*.14;
    const y=R.y+R.s-S.h+Math.min(6,R.s*.06);
    if(!inBounds(x,y,relaxed))continue;
    const spot={x,y,icon:R,side};
    (feetFree(x,y,R)?good:ok).push(spot);
  }
  const pool=good.length?good:ok;
  return pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
}

/* ---------- 動き ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function startIdle(){S.mode='idle';S.t=0;S.dur=rnd(1.2,3.5);S.goal=null;S.lookFlip=Math.random()<.35?rnd(.4,S.dur-.2):-1}
function startWalk(){S.goal={kind:'walk',...freeSpot()};S.hops=0;S.hesitated=false;nextHop()}
function startLeanTrip(){
  const sp=leanSpot();if(!sp){startWalk();return}
  S.goal={kind:'lean',...sp};S.hops=0;S.hesitated=false;nextHop();
}
function nextHop(){
  const g=S.goal;if(!g){startIdle();return}
  const dx=g.x-S.x,dy=g.y-S.y,dist=Math.hypot(dx,dy);
  if(++S.hops>60){startIdle();return}
  const stepLen=S.w*rnd(.32,.45);
  if(dist<4){arrive();return}
  /* 最後のひと跳び：寄りかかり先には障害物を無視して着地 */
  if(dist<=stepLen*1.15&&(g.kind==='lean'||feetFree(g.x,g.y))){hopTo(g.x,g.y,true,false);return}
  if(g.kind==='lean'&&dist<=S.h*1.6){hopTo(g.x,g.y,true,true);return}
  const base=Math.atan2(dy,dx),step=Math.min(dist,stepLen),b=bounds();
  const tryHop=(off,len,leap)=>{
    const a=base+off*Math.PI/180,nx=S.x+Math.cos(a)*len,ny=S.y+Math.sin(a)*len;
    if(!inBounds(nx,ny,b)||!feetFree(nx,ny))return false;
    if(off!==0&&!leap&&!S.hesitated&&Math.random()<.5){ // アイコンの前で一瞬止まってから避ける
      S.hesitated=true;S.mode='hesitate';S.t=0;S.dur=rnd(.3,.55);S.pending={x:nx,y:ny,leap};return true}
    hopTo(nx,ny,false,leap);return true;
  };
  /* 1) 目的地の方向へ小さく跳ぶ（少し角度をずらして避ける） */
  for(const off of [0,25,-25,50,-50])if(tryHop(off,step,false))return;
  /* 2) アイコンの列を大ジャンプで飛び越える */
  const pitch=Math.max(S.h*.6,(G.by-G.ay)*innerHeight/(ROWS-1));
  for(const m of [1,1.4,1.9,2.5])for(const off of [0,20,-20,40,-40]){
    const len=Math.min(dist+S.w*.2,pitch*m);if(len<step)continue;
    if(tryHop(off,len,true))return;
  }
  /* 3) 横に大きく回り込む */
  for(const off of [75,-75,100,-100,135,-135])if(tryHop(off,step,false))return;
  S.goal={kind:'walk',...freeSpot()};hopTo(S.x+rnd(-1,1)*4,S.y,false,false); // 行き詰まったら目的地を変える
}
function hopTo(x,y,final,leap){
  S.hopFrom={x:S.x,y:S.y};S.hopTo={x,y};S.finalHop=final;S.leap=!!leap;
  if(Math.abs(x-S.x)>2)S.dir=x>S.x?1:-1;
  S.mode='hop';S.t=0;S.dur=leap?.62:.42;
}
function arrive(){
  const g=S.goal;
  if(g&&g.kind==='lean'){
    S.x=g.x;S.y=g.y;S.mode='lean';S.t=0;S.dur=rnd(3,6.5);
    S.dir=g.side==='L'?-1:1; // 背中をアイコンに向ける（元画像は左向き）
    S.leanDir=g.side==='L'?1:-1;S.leanIcon=g.icon;
  }else startIdle();
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  requestAnimationFrame(frame);
  if(S.paused)return;
  S.t+=dt;
  let lift=0,sx=1,sy=1,targetTilt=0;
  if(S.mode==='idle'){
    const br=Math.sin(S.t*2.4)*.018;sx=1-br*.5;sy=1+br;
    if(S.lookFlip>0&&S.t>S.lookFlip){S.dir*=-1;S.lookFlip=-1}
    if(S.t>S.dur){if(S.afterLean){S.afterLean=false;startWalk()}else (icons().length&&Math.random()<.4)?startLeanTrip():startWalk()}
  }else if(S.mode==='hesitate'){
    const q=Math.sin(Math.PI*Math.min(1,S.t/S.dur));sx=1+.05*q;sy=1-.06*q;
    if(S.t>S.dur){const p=S.pending;hopTo(p.x,p.y,false,p.leap)}
  }else if(S.mode==='hop'){
    const k=Math.min(1,S.t/S.dur);
    S.x=S.hopFrom.x+(S.hopTo.x-S.hopFrom.x)*k;S.y=S.hopFrom.y+(S.hopTo.y-S.hopFrom.y)*k;
    lift=Math.sin(Math.PI*k)*S.h*(reduce?.04:(S.leap?.42:.13));
    if(k<.15){sx=1+.08*(1-k/.15);sy=1-.08*(1-k/.15)}else{sx=.96;sy=1.05}
    if(k>=1){S.mode='land';S.t=0;S.dur=.14}
  }else if(S.mode==='land'){
    const k=Math.min(1,S.t/S.dur);const q=Math.sin(Math.PI*k);sx=1+.09*q;sy=1-.09*q;
    if(k>=1){
      if(S.finalHop){S.finalHop=false;arrive()}
      else if(S.goal&&S.goal.kind==='walk'&&Math.random()<.1)startIdle();
      else nextHop();
    }
  }else if(S.mode==='lean'){
    /* 寄りかかってくつろぐ：ゆっくり傾いて、ときどき深呼吸 */
    const inK=Math.min(1,S.t/.6),outK=Math.min(1,Math.max(0,(S.dur-S.t)/.5));
    targetTilt=S.leanDir*9*Math.min(inK,outK);
    const br=Math.sin(S.t*1.6)*.022;sx=1-br*.5;sy=1+br;
    if(S.t>S.dur){S.mode='idle';S.t=0;S.dur=.3;S.lookFlip=-1;S.afterLean=true}
  }else if(S.mode==='jump'){
    const k=Math.min(1,S.t/S.dur);lift=Math.sin(Math.PI*k)*S.h*.45;sy=1.06;sx=.95;
    if(k>=1){S.mode='land';S.t=0;S.dur=.18;S.finalHop=false}
  }
  S.tilt+=(targetTilt-S.tilt)*Math.min(1,dt*10);
  chara.style.transform=`translate(${S.x}px,${S.y-lift}px) rotate(${S.tilt}deg) scale(${sx*-S.dir},${sy})`;
  const sh=1-lift/(S.h*.6);
  shadow.style.transform=`translate(${S.x+S.w*.1}px,${S.y+S.h-S.w*.09}px) scale(${Math.max(.45,sh)})`;
  shadow.style.opacity=Math.max(.35,sh);
}
chara.addEventListener('pointerdown',e=>{e.stopPropagation();
  if(S.mode==='lean'){S.mode='idle';S.t=0;S.dur=.1;S.afterLean=true}
  if(S.mode!=='jump'){S.mode='jump';S.t=0;S.dur=.55;S.goal=null}});

/* ---------- 設定UI ---------- */
let dimTimer;
function wake(){gear.classList.remove('dim');clearTimeout(dimTimer);dimTimer=setTimeout(()=>gear.classList.add('dim'),3000)}
stage.addEventListener('pointerdown',wake);
gear.onclick=()=>{sheet.classList.add('open');wake()};
$('close').onclick=()=>{sheet.classList.remove('open');wake()};
$('pickBg').onclick=$('emptyPick').onclick=()=>$('fileBg').click();
$('pickCh').onclick=()=>$('fileCh').click();
$('fileBg').onchange=async e=>{const f=e.target.files[0];if(!f)return;const src=await readFile(f);
  await setBg(src);DB.set('bg',src);detectIcons();saveGeo();e.target.value='';openCalib()};
$('fileCh').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;$('status').textContent='画像を準備しています…';
  try{let src=await readFile(f);if($('cut').checked)src=await cutout(src);await setChar(src);DB.set('char',src);rescue();$('status').textContent='キャラクターを切り替えました。'}
  catch(err){$('status').textContent='この画像は読み込めませんでした。PNGかJPEGで試してください。'}
  e.target.value='';
};
$('resetCh').onclick=async()=>{await setChar(DEFAULT_CHAR);DB.del('char');rescue();$('status').textContent='うさぎに戻しました。'};
$('size').oninput=e=>{S.sizePct=+e.target.value;layout();DB.set('size',S.sizePct)};
$('size').onchange=()=>rescue();
addEventListener('resize',()=>{layout();if(calib.classList.contains('on'))renderCalib()});

/* ---------- 起動 ---------- */
(async()=>{
  await DB.open();
  const [bg,ch,sz,geo,occ]=await Promise.all([DB.get('bg'),DB.get('char'),DB.get('size'),DB.get('geo'),DB.get('occ')]);
  if(sz){S.sizePct=sz;$('size').value=sz}
  if(geo)Object.assign(G,geo);
  await setBg(bg||null);
  if(occ&&occ.length===OCC.length)OCC=occ;else if(bg)detectIcons();
  updateIconInfo();
  await setChar(ch||DEFAULT_CHAR);
  const b=bounds();S.x=(b.minX+b.maxX)/2;S.y=b.maxY*.8;rescue();
  startIdle();wake();requestAnimationFrame(frame);
})();
</script>
</body>
